<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="The archive of Alex's notes." />
    <title>Archive — Alex's notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --background: #f7f7f4;
        --text: #20201e;
        --muted: #777771;
        --line: #dcdcd5;
        --accent: #b24b2a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font: 14px/1.8 "JetBrains Mono", monospace;
      }

      .layout {
        width: 100%;
        margin: 0 auto;
        padding: 0;
      }

      .back,
      nav a {
        color: var(--muted);
        text-decoration: none;
      }

      .back:hover,
      nav a:hover,
      .post:hover {
        color: var(--accent);
      }

      article {
        margin-top: 0;
      }

      .eyebrow,
      .section-title,
      time {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .post-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        background: var(--line);
      }

      .post {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        aspect-ratio: 1;
        padding: clamp(20px, 3vw, 40px);
        background: var(--background);
        color: var(--text);
        text-decoration: none;
        transition: background-color 160ms ease, color 160ms ease;
      }

      .post:hover {
        background: #efefea;
      }

      .post time {
        display: block;
        align-self: flex-end;
        text-align: right;
      }

      .post:hover time {
        animation: date-glitch 220ms steps(1, end);
      }

      @keyframes date-glitch {
        0%,
        100% {
          color: var(--muted);
          transform: translateX(0);
        }

        25% {
          color: var(--accent);
          transform: translateX(-2px);
        }

        50% {
          color: var(--accent);
          transform: translateX(1px);
        }

        75% {
          color: var(--muted);
          transform: translateX(-1px);
        }
      }

      .post-content {
        max-width: 34ch;
      }

      .post-title {
        display: block;
        min-height: 1.5em;
        font-size: clamp(15px, 1.5vw, 20px);
        font-weight: 500;
        line-height: 1.5;
      }

      .post p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0;
      }

      footer {
        margin-top: 72px;
        color: var(--muted);
        font-size: 12px;
      }

      footer > div {
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }

      .footer-nav {
        margin-top: 16px;
      }

      .footer-nav a + a::before {
        content: "/";
        margin: 0 12px;
        color: var(--line);
      }

      @media (max-width: 1000px) {
        .post-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 520px) {
        .post-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .post {
          transition: none;
        }

        .post:hover time {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <main>
        <article>
          <div class="post-grid" aria-label="All notes">
            <a class="post" href="posts/bog.html">
              <time datetime="2026-12-25">2026.12.25</time>
              <div class="post-content">
                <span class="post-title">Esej o bogu i božanskim stvarima</span>
                <p>Postoji li bog? Imam odgovor!</p>
              </div>
            </a>
            <a class="post" href="posts/kuharica1.html">
              <time datetime="2026-10-01">2026.10.01</time>
              <div class="post-content">
                <span class="post-title">Antikapitalistička kuharica 1</span>
                <p>Što ne valja s kapitalizmom?</p>
              </div>
            </a>
            <a class="post" href="posts/idijotske-price.html">
              <time datetime="2026-08-28">2026.08.28</time>
              <div class="post-content">
                <span class="post-title">Idijotske priče</span>
                <p>Razmišljao sam napisati knjigu. Ali nisam. Fric je.</p>
              </div>
            </a>
            <a class="post" href="posts/glupost-je-neunistiva.html">
              <time datetime="2026-07-19">2026.07.19</time>
              <div class="post-content">
                <span class="post-title">Glupost je neuništiva</span>
                <p>KUD Idijoti. Stare pizde.</p>
              </div>
            </a>
          </div>
        </article>

      </main>
    </div>
    <script>
      const characters = "01<>-_+[]{}/*=~";
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const encodeText = (text) =>
        text
          .split("")
          .map((character) => {
            if (character === " ") {
              return character;
            }
            return characters[Math.floor(Math.random() * characters.length)];
          })
          .join("");

      document.querySelectorAll(".post").forEach((post) => {
        const title = post.querySelector(".post-title");
        const summary = post.querySelector("p");
        const animations = [
          { element: title, original: title.textContent, speed: 35, delay: 0, step: 1.5 },
          { element: summary, original: summary.textContent, speed: 50, delay: 120, step: 1.5 },
        ].map((animation) => ({
          ...animation,
          encoded: encodeText(animation.original),
        }));
        let timers = [];

        if (reducedMotion) {
          return;
        }

        animations.forEach(({ element, encoded }) => {
          element.textContent = encoded;
        });

        const clearTimers = () => {
          timers.forEach((timer) => {
            clearTimeout(timer);
            clearInterval(timer);
          });
          timers = [];
        };

        const animateText = ({ element, original, encoded, speed, delay, step }) => {
          let progress = 0;
          const start = setTimeout(() => {
            const animation = setInterval(() => {
              element.textContent = original
                .split("")
                .map((character, index) => {
                  if (character === " " || index < progress) {
                    return character;
                  }
                  return encoded[index];
                })
                .join("");

              progress += step;
              if (progress >= original.length) {
                clearInterval(animation);
                element.textContent = original;
              }
            }, speed);
            timers.push(animation);
          }, delay);
          timers.push(start);
        };

        post.addEventListener("mouseenter", () => {
          clearTimers();
          animations.forEach(({ element, encoded }) => {
            element.textContent = encoded;
          });
          animations.forEach(animateText);
        });

        post.addEventListener("mouseleave", () => {
          clearTimers();
          animations.forEach(({ element, encoded }) => {
            element.textContent = encoded;
          });
        });
      });
    </script>
  </body>
</html>
