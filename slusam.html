<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Bilješke o onome što slušam." />
    <title>Slušam — byka</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="stylesheet" href="assets/grid.css" />
    <style>
      .layout {
        width: 100%;
        max-width: none;
        margin: 0 auto;
        padding: 0;
      }

      article {
        margin-top: 0;
      }

      .radio-card {
        width: 100%;
        border: 0;
        padding: clamp(20px, 3vw, 40px);
        background: var(--background);
        color: var(--text);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .radio-card:hover {
        color: var(--accent);
      }

      .radio-card[aria-pressed="true"] {
        color: var(--accent);
      }

      .radio-status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .radio-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }

      .radio-card[aria-pressed="true"] .radio-status {
        color: var(--accent);
      }

      .radio-card[aria-pressed="true"] .radio-dot {
        animation: radio-pulse 1.4s ease-in-out infinite;
      }

      @keyframes radio-pulse {
        0%,
        100% {
          opacity: 0.35;
        }

        50% {
          opacity: 1;
        }
      }

      .note-title {
        display: block;
        color: inherit;
        font-size: clamp(13px, 1.1vw, 16px);
        font-weight: 500;
        line-height: 1.5;
      }

      .radio-card .note {
        margin: auto 0;
        text-align: center;
      }

      .radio-card .note-title {
        font-size: clamp(15px, 1.5vw, 20px);
      }

      .note-sub {
        display: block;
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      .radio-card:hover .note-sub {
        color: var(--accent);
      }

      .yt-card {
        position: relative;
        cursor: pointer;
      }

      .yt-card[aria-pressed="true"] .radio-status,
      .yt-card[aria-pressed="true"] {
        color: var(--accent);
      }

      .yt-card[aria-pressed="true"] .radio-dot {
        animation: radio-pulse 1.4s ease-in-out infinite;
      }

      .yt-card .yt-player {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .radio-card[aria-pressed="true"] .radio-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <main>
        <article>
          <div class="post-grid" aria-label="Bilješke o slušanju">
            <button class="post radio-card" type="button" data-stream="https://radio.widecast.cloud/stream/radiorojc.mp3" aria-label="Radio Rojc Pula" aria-pressed="false">
              <span class="radio-status"><span class="radio-dot" aria-hidden="true"></span>na projektu</span>
              <span class="note">
                <span class="note-title">Radio Rojc Pula</span>
                <span class="note-sub">pravi nezavisni radio. klikni pa čuj.</span>
              </span>
              <time>001</time>
            </button>
            <button class="post radio-card" type="button" data-stream="https://stream.yammat.fm/radio/8000/yammat.mp3" aria-label="Yammat FM" aria-pressed="false">
              <span class="radio-status"><span class="radio-dot" aria-hidden="true"></span>na projektu</span>
              <span class="note">
                <span class="note-title">Yammat FM</span>
                <span class="note-sub">radio za ljude i umjetnost. zagreb, 102.5 MHz.</span>
              </span>
              <time>002</time>
            </button>
            <section class="post yt-card" role="button" tabindex="0" aria-label="YouTube playlist, slušaj nasumični zapis" aria-pressed="false">
              <span class="radio-status"><span class="radio-dot" aria-hidden="true"></span>na projektu</span>
              <span class="note">
                <span class="note-title">Playlist</span>
                <span class="note-sub">jukebox iznenadjenja. svaki klik, drugi zapis.</span>
              </span>
              <time>003</time>
              <span class="yt-player" aria-hidden="true"></span>
            </section>
            <section class="post">
              <time>004</time>
              <p class="note" contenteditable="true" data-placeholder="Upiši bilješku..." aria-label="Bilješka 004">Tko sluša, taj ne govori. A tko govori, taj barem ne sluša.</p>
            </section>
            <section class="post">
              <time>005</time>
              <p class="note" contenteditable="true" data-placeholder="Upiši bilješku..." aria-label="Bilješka 005"></p>
            </section>
            <section class="post">
              <time>006</time>
              <p class="note" contenteditable="true" data-placeholder="Upiši bilješku..." aria-label="Bilješka 006"></p>
            </section>
            <section class="post">
              <time>007</time>
              <p class="note" contenteditable="true" data-placeholder="Upiši bilješku..." aria-label="Bilješka 007"></p>
            </section>
            <section class="post">
              <time>008</time>
              <p class="note" contenteditable="true" data-placeholder="Upiši bilješku..." aria-label="Bilješka 008"></p>
            </section>
            <section class="post">
              <time>009</time>
              <p class="note" contenteditable="true" data-placeholder="Upiši bilješku..." aria-label="Bilješka 009"></p>
            </section>
          </div>
        </article>
      </main>
    </div>
    <script>
      const radioCards = [...document.querySelectorAll(".radio-card")];

      const setStatus = (card, text) => {
        const status = card.querySelector(".radio-status");
        status.replaceChildren(
          status.querySelector(".radio-dot"),
          document.createTextNode(text),
        );
      };

      const stopStream = (card, stream, text) => {
        stream.pause();
        stream.removeAttribute("src");
        stream.load();
        card.setAttribute("aria-pressed", "false");
        setStatus(card, text);
      };

      const ytCard = document.querySelector(".yt-card");
      const ytStatus = ytCard.querySelector(".radio-status");
      const ytPlayerHost = ytCard.querySelector(".yt-player");
      const PLAYLIST_ID = "PLc3LtrDWaPMrd3yz8Jwu0EALmUTsSmTvE";
      let ytPlayer = null;
      let ytReady = false;
      let ytWantPlaying = false;

      const setYtStatus = (text) => {
        ytStatus.replaceChildren(
          ytStatus.querySelector(".radio-dot"),
          document.createTextNode(text),
        );
      };

      const stopRadioCards = () => {
        radioCards.forEach((other) => {
          if (other.getAttribute("aria-pressed") === "true") {
            stopStream(other, other._stream, "na projektu");
          }
        });
      };

      const stopYt = (text) => {
        ytWantPlaying = false;
        if (ytPlayer && ytReady) {
          ytPlayer.stopVideo();
        }
        ytCard.setAttribute("aria-pressed", "false");
        setYtStatus(text);
      };

      const startRandomYt = () => {
        ytWantPlaying = true;
        ytCard.setAttribute("aria-pressed", "true");
        setYtStatus("u eteru");

        if (ytPlayer && ytReady) {
          const total = ytPlayer.getPlaylist().length;
          ytPlayer.playVideoAt(Math.floor(Math.random() * total));
        } else {
          loadYtPlayer();
        }
      };

      const loadYtPlayer = () =>
        new Promise((resolve) => {
          if (ytPlayer) {
            resolve();
            return;
          }
          window.onYouTubeIframeAPIReady = () => {
            ytPlayer = new YT.Player(ytPlayerHost, {
              host: "https://www.youtube-nocookie.com",
              playerVars: {
                listType: "playlist",
                list: PLAYLIST_ID,
              },
              events: {
                onReady: () => {
                  ytReady = true;
                  ytPlayer.setShuffle(true);
                  if (ytWantPlaying) {
                    ytPlayer.playVideoAt(Math.floor(Math.random() * ytPlayer.getPlaylist().length));
                  }
                  resolve();
                },
                onStateChange: (event) => {
                  if (event.data === YT.PlayerState.ENDED) {
                    stopYt("na projektu");
                  }
                },
                onError: () => stopYt("murija na vezi"),
              },
            });
          };

          const tag = document.createElement("script");
          tag.src = "https://www.youtube.com/iframe_api";
          document.head.appendChild(tag);
        });

      ytCard.addEventListener("click", () => {
        stopRadioCards();
        if (ytCard.getAttribute("aria-pressed") !== "true") {
          startRandomYt();
          return;
        }
        stopYt("na projektu");
      });

      ytCard.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          ytCard.click();
        }
      });

      radioCards.forEach((card) => {
        const stream = document.createElement("audio");
        stream.preload = "none";
        card._stream = stream;

        card.addEventListener("click", async () => {
          if (card.getAttribute("aria-pressed") !== "true") {
            stopYt("na projektu");
            radioCards.forEach((other) => {
              if (other !== card && other.getAttribute("aria-pressed") === "true") {
                stopStream(other, other._stream, "na projektu");
              }
            });

            stream.src = card.dataset.stream;
            try {
              await stream.play();
              card.setAttribute("aria-pressed", "true");
              setStatus(card, "u eteru");
            } catch (error) {
              console.error("Radio stream nije moguće pokrenuti.", error);
              setStatus(card, "murija na vezi");
            }
            return;
          }

          stopStream(card, stream, "na projektu");
        });

        stream.addEventListener("ended", () => stopStream(card, stream, "na projektu"));
        stream.addEventListener("error", () => stopStream(card, stream, "murija na vezi"));
      });
    </script>
  </body>
</html>
