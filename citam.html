<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Bilješke o onome što čitam." />
    <title>Čitam — byka</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: #f7f7f4;
        --text: #20201e;
        --muted: #777771;
        --line: #dcdcd5;
        --accent: #b24b2a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        cursor: url("assets/feral-cursor-128.png") 64 43, auto;
        margin: 0;
        background: var(--background);
        color: var(--text);
        font: 14px/1.8 "JetBrains Mono", monospace;
      }

      ::selection {
        background: var(--accent);
        color: #f7f7f4;
      }

      a:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 2px;
      }

      .layout {
        width: 100%;
        margin: 0 auto;
        padding: 0;
      }

      article {
        margin-top: 0;
      }

      time {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .post.read time::before {
        content: "·";
        margin-right: 8px;
        color: var(--accent);
      }

      .post-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        background: var(--line);
      }

      .post {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        aspect-ratio: 1;
        padding: clamp(20px, 3vw, 40px);
        background: var(--background);
        color: var(--text);
        transition: background-color 160ms ease, color 160ms ease;
      }

      .post:hover {
        background: #efefea;
        color: var(--accent);
      }

      .post time {
        display: block;
        align-self: flex-end;
        text-align: right;
      }

      .note {
        width: 100%;
        max-width: 34ch;
        margin: 0;
        color: inherit;
      }

      .note-title {
        display: block;
        color: inherit;
        font-family: "Newsreader", Georgia, serif;
        font-optical-sizing: auto;
        font-style: italic;
        font-weight: 400;
        font-size: clamp(17px, 1.5vw, 24px);
        line-height: 1.35;
      }

      .note p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      .post:hover .note:empty::before {
        color: var(--accent);
        opacity: 1;
      }

      .post:hover .note p {
        color: var(--accent);
      }

      @media (max-width: 1000px) {
        .post-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 520px) {
        .post-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <main>
        <article>
          <div class="post-grid" aria-label="Bilješke o čitanju">
            <section class="post">
              <time>001</time>
              <div class="note">
                <span class="note-title">Obavijesti o kretanju brodova</span>
                <p>Annie Proulx</p>
              </div>
            </section>
            <section class="post"><time>002</time><div class="note"><span class="note-title">The Story of Capital</span><p>David Harvey</p></div></section>
            <section class="post read"><time>003</time><div class="note"><span class="note-title">The Anti-Capitalist Chronicles</span><p>David Harvey</p></div></section>
            <section class="post"><time>004</time><div class="note"><span class="note-title">Majstor i Margarita</span><p>Mihail Bulgakov</p></div></section>
            <section class="post"><time>005</time><div class="note"><span class="note-title">Zvižduk s Bukovca</span><p>Zvonimir Milčec</p></div></section>
            <section class="post"><time>006</time><div class="note"></div></section>
            <section class="post"><time>007</time><div class="note"></div></section>
            <section class="post"><time>008</time><div class="note"></div></section>
            <section class="post"><time>009</time><div class="note"></div></section>
          </div>
        </article>
      </main>
    </div>
  </body>
</html>
